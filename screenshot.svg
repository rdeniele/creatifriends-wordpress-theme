<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="CreatiFriends theme preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#E6C766"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <rect x="80" y="320" width="40" height="1" fill="url(#gold)"/>
  <text x="140" y="328" font-family="Inter, sans-serif" font-size="16" letter-spacing="6" fill="#D4AF37">A REMOTE-FIRST CREATIVE STUDIO</text>
  <text x="80" y="500" font-family="'Cormorant Garamond', Georgia, serif" font-size="140" font-weight="400" fill="#FFFFFF" letter-spacing="-4">CreatiFriends</text>
  <text x="84" y="560" font-family="Inter, sans-serif" font-size="22" fill="#B3B3B3">Brands, products and stories that move.</text>
  <rect x="80" y="640" width="200" height="56" fill="#FFFFFF"/>
  <text x="180" y="675" font-family="Inter, sans-serif" font-size="14" font-weight="500" letter-spacing="2" fill="#0A0A0A" text-anchor="middle">START A PROJECT</text>
  <rect x="300" y="640" width="220" height="56" fill="none" stroke="#2A2A2A"/>
  <text x="410" y="675" font-family="Inter, sans-serif" font-size="14" font-weight="500" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">VIEW SELECTED WORK</text>
  <rect x="80" y="800" width="1040" height="1" fill="#2A2A2A"/>
</svg>
